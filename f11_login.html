<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #08090f;
            --panel: #10131d;
            --panel-2: #151927;
            --text: #f8fbff;
            --muted: #9aa4b2;
            --line: rgba(255, 255, 255, 0.14);
            --cyan: #00e5ff;
            --pink: #ff2bd6;
            --lime: #b6ff3b;
            --orange: #ff8a00;
            --danger: #ff4d6d;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 28px;
            color: var(--text);
            font-family: "Segoe UI", Arial, sans-serif;
            background:
                linear-gradient(120deg, rgba(0, 229, 255, 0.2), transparent 26%),
                linear-gradient(300deg, rgba(255, 43, 214, 0.24), transparent 30%),
                linear-gradient(180deg, #08090f 0%, #10111a 52%, #08090f 100%);
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.04) 0 1px, transparent 1px 58px),
                repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.035) 0 1px, transparent 1px 58px);
        }

        .shell {
            position: relative;
            width: min(100%, 1120px);
            min-height: 650px;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 430px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: rgba(12, 14, 24, 0.78);
            box-shadow: 0 34px 110px rgba(0, 0, 0, 0.56);
            backdrop-filter: blur(20px);
            overflow: hidden;
            isolation: isolate;
        }

        .shell::before {
            content: "";
            position: absolute;
            inset: -1px;
            z-index: -1;
            background: linear-gradient(120deg, var(--cyan), transparent 30%, var(--pink) 68%, var(--lime));
            opacity: 0.5;
        }

        .showcase {
            position: relative;
            min-height: 650px;
            padding: 44px;
            overflow: hidden;
        }

        .showcase::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(112deg, rgba(0, 229, 255, 0.18), transparent 38%),
                linear-gradient(292deg, rgba(255, 43, 214, 0.18), transparent 40%);
        }

        .showcase::after {
            content: "";
            position: absolute;
            right: -105px;
            top: 66px;
            width: 430px;
            height: 430px;
            background: linear-gradient(135deg, rgba(0, 229, 255, 0.8), rgba(255, 43, 214, 0.8) 54%, rgba(182, 255, 59, 0.85));
            clip-path: polygon(28% 0, 100% 16%, 84% 100%, 0 76%);
            opacity: 0.76;
            filter: blur(1px);
        }

        .brand,
        .hero {
            position: relative;
            z-index: 1;
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
        }

        .logo {
            width: 52px;
            height: 52px;
            display: grid;
            place-items: center;
            border-radius: 8px;
            color: #061016;
            background: var(--lime);
            font-size: 1.45rem;
            font-weight: 900;
            box-shadow: 8px 8px 0 var(--pink);
        }

        .live-tag {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            min-height: 36px;
            padding: 0 13px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 8px;
            color: var(--text);
            background: rgba(255, 255, 255, 0.08);
            font-size: 0.82rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .live-tag span {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--cyan);
            box-shadow: 0 0 18px var(--cyan);
        }

        .hero {
            max-width: 610px;
            margin-top: 86px;
        }

        .hero h1 {
            max-width: 600px;
            font-size: clamp(3rem, 6vw, 6.4rem);
            line-height: 0.9;
            letter-spacing: 0;
            text-transform: uppercase;
        }

        .hero h1 span {
            color: transparent;
            -webkit-text-stroke: 2px var(--cyan);
            text-shadow: 0 0 32px rgba(0, 229, 255, 0.32);
        }

        .hero p {
            max-width: 470px;
            margin-top: 24px;
            color: #d8dee8;
            font-size: 1.04rem;
            line-height: 1.75;
        }

        .login-panel {
            position: relative;
            display: grid;
            align-content: center;
            padding: 46px;
            background: linear-gradient(180deg, rgba(21, 25, 39, 0.96), rgba(10, 12, 20, 0.98));
            border-left: 1px solid rgba(255, 255, 255, 0.12);
        }

        .login-panel::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--cyan), var(--pink), var(--lime));
        }

        .heading {
            margin-bottom: 32px;
        }

        .eyebrow {
            display: inline-block;
            margin-bottom: 14px;
            color: var(--lime);
            font-size: 0.78rem;
            font-weight: 900;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .heading h2 {
            margin-bottom: 10px;
            font-size: 2.4rem;
            line-height: 1;
            letter-spacing: 0;
        }

        .heading p {
            color: var(--muted);
            line-height: 1.6;
        }

        form {
            display: grid;
            gap: 18px;
        }

        .field {
            display: grid;
            gap: 8px;
        }

        label {
            color: #e7edf5;
            font-size: 0.92rem;
            font-weight: 800;
        }

        .input-wrap {
            position: relative;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            height: 56px;
            border: 1px solid rgba(255, 255, 255, 0.13);
            border-radius: 8px;
            padding: 0 58px 0 16px;
            color: var(--text);
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.07);
            outline: none;
            transition: border-color 180ms ease, background 180ms ease, box-shadow 180ms ease, transform 180ms ease;
        }

        input::placeholder {
            color: #788393;
        }

        input:focus {
            border-color: var(--cyan);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 0 4px rgba(0, 229, 255, 0.14), 0 0 30px rgba(0, 229, 255, 0.12);
            transform: translateY(-1px);
        }

        .field-icon,
        .toggle-password {
            position: absolute;
            top: 50%;
            right: 14px;
            transform: translateY(-50%);
        }

        .field-icon {
            color: var(--cyan);
            font-size: 0.9rem;
            font-weight: 900;
            pointer-events: none;
        }

        .toggle-password {
            min-width: 44px;
            height: 30px;
            border: 0;
            border-radius: 8px;
            color: var(--lime);
            background: rgba(182, 255, 59, 0.08);
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 900;
        }

        .toggle-password:hover {
            background: rgba(182, 255, 59, 0.18);
        }

        .options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            font-size: 0.9rem;
        }

        .remember {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--muted);
            font-weight: 700;
        }

        .remember input {
            width: 16px;
            height: 16px;
            accent-color: var(--pink);
        }

        a {
            color: var(--cyan);
            font-weight: 900;
            text-decoration: none;
        }

        .message {
            min-height: 20px;
            color: var(--danger);
            font-size: 0.88rem;
            font-weight: 800;
        }

        .success {
            color: var(--lime);
        }

        .login-btn {
            position: relative;
            height: 58px;
            border: 0;
            border-radius: 8px;
            color: #071015;
            background: linear-gradient(90deg, var(--cyan), var(--lime));
            font-size: 1rem;
            font-weight: 950;
            cursor: pointer;
            overflow: hidden;
            box-shadow: 0 18px 34px rgba(0, 229, 255, 0.22);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 14px;
            color: var(--muted);
            font-size: 0.86rem;
            font-weight: 700;
        }

        .divider::before,
        .divider::after {
            content: "";
            height: 1px;
            flex: 1;
            background: rgba(255, 255, 255, 0.13);
        }

        .socials {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .socials button {
            height: 48px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 8px;
            color: var(--text);
            background: rgba(255, 255, 255, 0.07);
            cursor: pointer;
            font-weight: 900;
        }

        .signup {
            color: var(--muted);
            text-align: center;
            font-size: 0.94rem;
        }

        @media (max-width: 920px) {
            .shell {
                grid-template-columns: 1fr;
            }

            .showcase {
                min-height: 560px;
                padding: 32px;
            }

            .login-panel {
                padding: 36px 32px 40px;
                border-left: 0;
            }
        }

        @media (max-width: 540px) {
            body {
                padding: 0;
            }

            .shell {
                min-height: 100vh;
                border: 0;
                border-radius: 0;
            }

            .showcase {
                min-height: 500px;
                padding: 24px 20px;
            }

            .hero h1 {
                font-size: 3.1rem;
            }

            .socials {
                grid-template-columns: 1fr;
            }

            .options {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <main class="shell" aria-label="Login page">
        <section class="showcase" aria-label="Welcome">
            <div class="brand">
                <div class="logo" aria-hidden="true">L</div>
                <div class="live-tag"><span></span>Live access</div>
            </div>

            <div class="hero">
                <h1>Login to <span>level up</span></h1>
                <p>Jump back into your workspace with a fast, focused, high-energy sign in screen.</p>
            </div>
        </section>

        <section class="login-panel" aria-label="Login form">
            <div class="heading">
                <!-- <span class="eyebrow">Member access</span> -->
                <h2>Welcome back Abhay</h2>
                <p>Enter your details and continue.</p>
            </div>

            <form action="login.php" method="post" id="loginForm">
                <div class="field">
                    <label for="username">Username</label>
                    <div class="input-wrap">
                        <input type="text" id="username" name="username" required autocomplete="username" placeholder="Enter your username">
                        <span class="field-icon" aria-hidden="true">@</span>
                    </div>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <div class="input-wrap">
                        <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Enter your password">
                        <button class="toggle-password" type="button" aria-label="Show password" data-visible="false">Show</button>
                    </div>
                </div>

                <div class="options">
                    <label class="remember" for="remember">
                        <input type="checkbox" id="remember" name="remember">
                        Remember me
                    </label>
                    <a href="#">Forgot password?</a>
                </div>

                <p class="message" id="message" aria-live="polite"></p>

                <button class="login-btn" type="submit">Login</button>

                <div class="divider">or continue with</div>

                <div class="socials" aria-label="Other login options">
                    <button type="button">Google</button>
                    <button type="button">GitHub</button>
                </div>

                <p class="signup">New here? <a href="#">Create an account</a></p>
            </form>
        </section>
    </main>

    <script>
        const form = document.getElementById("loginForm");
        const username = document.getElementById("username");
        const password = document.getElementById("password");
        const message = document.getElementById("message");
        const togglePassword = document.querySelector(".toggle-password");

        togglePassword.addEventListener("click", () => {
            const isVisible = togglePassword.dataset.visible === "true";
            password.type = isVisible ? "password" : "text";
            togglePassword.dataset.visible = String(!isVisible);
            togglePassword.textContent = isVisible ? "Show" : "Hide";
            togglePassword.setAttribute("aria-label", isVisible ? "Show password" : "Hide password");
        });

        form.addEventListener("submit", (event) => {
            message.classList.remove("success");

            if (username.value.trim().length < 3) {
                event.preventDefault();
                message.textContent = "Username must be at least 3 characters.";
                username.focus();
                return;
            }

            if (password.value.length < 6) {
                event.preventDefault();
                message.textContent = "Password must be at least 6 characters.";
                password.focus();
                return;
            }

            message.classList.add("success");
            message.textContent = "Looks good. Signing you in...";
        });
    </script>
</body>
</html>
