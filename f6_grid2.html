<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Dashboard</title>

    <style>
        @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap");

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            font-family: "Poppins", sans-serif;

            background: linear-gradient(135deg, #07111f, #101d42);

            color: white;

            padding: 20px;
        }

        .container {
            min-height: calc(100vh - 40px);

            border: 1px solid rgba(255, 255, 255, 0.15);

            border-radius: 25px;

            overflow: hidden;

            display: grid;

            grid-template-rows: 90px 1fr 80px;

            background: rgba(255, 255, 255, 0.05);

            backdrop-filter: blur(10px);
        }

        /* HEADER */

        header {
            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 0 40px;

            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            font-size: 2rem;

            font-weight: 700;
        }

        nav ul {
            list-style: none;

            display: flex;

            gap: 30px;
        }

        nav a {
            text-decoration: none;

            color: white;

            transition: .3s;
        }

        nav a:hover {
            color: #00d4ff;
        }

        /* CONTENT */

        article {
            display: grid;

            grid-template-columns: 1.2fr .8fr;
        }

        .hero {
            padding: 60px;

            display: flex;

            flex-direction: column;

            justify-content: center;
        }

        .hero h3 {
            color: #00d4ff;

            margin-bottom: 15px;

            letter-spacing: 3px;
        }

        .hero h1 {
            font-size: 4rem;

            margin-bottom: 20px;
        }

        .hero span {
            color: #00d4ff;
        }

        .hero p {
            font-size: 1.2rem;

            line-height: 1.8;

            max-width: 600px;
        }

        .buttons {
            margin-top: 35px;

            display: flex;

            gap: 20px;
        }

        .btn {
            padding: 14px 30px;

            border: none;

            border-radius: 12px;

            cursor: pointer;

            font-size: 1rem;

            transition: .3s;
        }

        .primary {
            background: #00d4ff;

            color: black;
        }

        .secondary {
            background: transparent;

            color: white;

            border: 1px solid white;
        }

        .btn:hover {
            transform: translateY(-5px);
        }

        /* RIGHT PANEL */

        .cards {
            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 20px;

            padding: 40px;

            align-content: center;
        }

        .card {
            height: 180px;

            border-radius: 20px;

            background: rgba(255, 255, 255, 0.08);

            display: flex;

            justify-content: center;

            align-items: center;

            text-align: center;

            font-size: 1.3rem;

            font-weight: 600;

            transition: .4s;
        }

        .card:hover {
            transform: translateY(-10px);

            box-shadow: 0 0 25px rgba(0, 212, 255, .4);

            cursor: pointer;
        }

        /* FOOTER */

        footer {
            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 0 40px;

            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .social {
            display: flex;

            gap: 20px;
        }

        .social a {
            text-decoration: none;

            color: white;

            transition: .3s;
        }

        .social a:hover {
            color: #00d4ff;
        }

        /* RESPONSIVE */

        @media (max-width: 900px) {
            article {
                grid-template-columns: 1fr;
            }

            .cards {
                grid-template-columns: repeat(2, 1fr);
            }

            .hero h1 {
                font-size: 3rem;
            }
        }

        @media (max-width: 700px) {
            header {
                flex-direction: column;

                padding: 20px;

                height: auto;
            }

            nav ul {
                margin-top: 20px;

                flex-wrap: wrap;

                justify-content: center;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            footer {
                flex-direction: column;

                gap: 15px;

                padding: 20px;
            }

            .hero {
                padding: 40px 25px;
            }

            .hero h1 {
                font-size: 2.3rem;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <header>

            <div class="logo">ABHAY</div>

            <nav>
                <ul>
                    <li><a href="#">Home</a></li>

                    <li><a href="#">Skills</a></li>

                    <li><a href="#">Projects</a></li>

                    <li><a href="#">Contact</a></li>
                </ul>
            </nav>

        </header>

        <article>

            <section class="hero">

                <h3>FULL-STACK DEVELOPER</h3>

                <h1>Building <span>Digital</span> Experiences</h1>

                <p>
                    I enjoy designing responsive interfaces,
                    developing web applications, and exploring
                    modern technologies.
                </p>

                <div class="buttons">

                    <button class="btn primary">
                        View Projects
                    </button>

                    <button class="btn secondary">
                        Contact Me
                    </button>

                </div>

            </section>

            <section class="cards">

                <div class="card">
                    HTML<br>CSS
                </div>

                <div class="card">
                    JavaScript
                </div>

                <div class="card">
                    UI/UX
                </div>

                <div class="card">
                    Java
                </div>

            </section>

        </article>

        <footer>

            <p>© 2026 Abhay</p>

            <div class="social">

                <a href="#">GitHub</a>

                <a href="#">LinkedIn</a>

                <a href="#">Portfolio</a>

            </div>

        </footer>

    </main>

</body>

</html>
