<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Layout</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#03033d;
    color:white;
    font-family:Arial, sans-serif;
    margin: 0;
    height: 100vh;
    width: 100%;
    
}

main{
    height:100vh;
    border:2px solid white;

    display:grid;
    grid-template-rows:10vh 1fr 10vh;
}

header{
    display:grid;
    grid-template-columns:1fr 1fr;
}

header section{
    border:2px solid white;
    padding:10px;
}

article{
    border: 2px solid white;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 30px;
}

article section{
    border:2px solid white;
    display:flex;
    align-items:center;
}


.box{
    width:260px;
    height:110px;
    background:#2da8ff;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
    text-align:center;
}

footer{
    display:grid;
    grid-template-columns:1fr 1fr;
}

footer section{
    border:2px solid white;
    padding:10px;
}
</style>
</head>

<body>

<main>

    <header>
        <section>Logo</section>
        <section>Links</section>
    </header>

    <article>
        <p class="box">Bigger Rectangular Box</p>
        <p class="box">Bigger Rectangular Box</p>
    </article>

    <footer>
        <section>Footer1</section>
        <section>Footer2</section>
    </footer>

</main>

</body>
</html>
