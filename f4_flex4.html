<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Four Boxes Center</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#2d2d2d;
    color:white;
    font-family:Arial, sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

main{
    width:90%;
    height:80vh;
    border:2px solid white;
    padding:15px;
}

h2{
    margin-bottom:20px;
}

section{
    height:calc(100% - 40px);
    display:grid;
    grid-template-columns:repeat(2,150px);
    grid-template-rows:repeat(2,80px);
    justify-content:center;
    align-content:center;
    gap:20px;
}

p{
    background:#33aaff;
    border-radius:10px;
}
</style>

</head>

<body>

<main>
    <h2>Four boxes at center</h2>

    <section>
        <p></p>
        <p></p>
        <p></p>
        <p></p>
    </section>
    <h3><br>abhay 2510990566</h3>
</main>
</body>
</html>
